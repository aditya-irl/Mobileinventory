<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="description" content="Rathore Mobiles - Production-grade mobile phone inventory management, sales tracking, and buyback ledger system." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://mobileinventory.vercel.app/" />

    <!-- Open Graph / Meta -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mobileinventory.vercel.app/" />
    <meta property="og:title" content="Rathore Mobiles — Mobile Inventory Management" />
    <meta property="og:description" content="Production-grade mobile phone inventory management and buyback system." />
    <meta property="og:image" content="/logo.svg" />

    <!-- LCP Asset Preload (High Priority Logo) -->
    <link rel="preload" href="/logo.svg" as="image" type="image/svg+xml" fetchpriority="high" />

    <!-- Google Fonts DNS Prefetch & Preconnect -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Non-render-blocking Asynchronous Google Fonts with display=swap -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      />
    </noscript>

    <!-- PWA Manifest & App Icons -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/logo.svg" />

    <title>Rathore Mobiles — Mobile Inventory Management</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
