<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- App Icon Background -->
  <rect width="200" height="200" rx="44" fill="url(#primaryGrad)" />
  
  <!-- Outer Smartphone Shape -->
  <rect x="52" y="30" width="96" height="140" rx="18" fill="#0F172A" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="3.5" />
  
  <!-- Screen Area -->
  <rect x="58" y="44" width="84" height="110" rx="10" fill="#1E293B" />
  
  <!-- Dynamic Island / Speaker notch -->
  <rect x="86" y="36" width="28" height="4.5" rx="2.25" fill="#64748B" />
  
  <!-- Inventory Stack & Spark Graphic inside screen -->
  <path d="M72 74L100 60L128 74L100 88L72 74Z" fill="url(#accentGrad)" filter="url(#glow)"/>
  <path d="M72 90L100 104L128 90" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M72 108L100 122L128 108" stroke="#818CF8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Spark Indicator Dot -->
  <circle cx="100" cy="144" r="3.5" fill="#10B981" />
</svg>
